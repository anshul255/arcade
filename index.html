<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anshul's Arcade</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0f0c12;color:#e9dcc3;font-family:Georgia,'Times New Roman',serif}
  .wrap{text-align:center;padding:24px}
  h1{font-variant:small-caps;font-weight:500;letter-spacing:.18em;font-size:clamp(26px,5vw,40px);margin:0 0 34px}
  a.game{display:block;max-width:420px;margin:0 auto 18px;padding:22px 28px;text-decoration:none;
    border:1px solid rgba(192,138,62,.45);border-radius:6px;color:#e9dcc3;transition:all .2s}
  a.game:hover{background:rgba(192,138,62,.12);box-shadow:0 0 24px rgba(192,138,62,.2)}
  a.game b{display:block;font-size:19px;font-variant:small-caps;letter-spacing:.1em;color:#c08a3e;margin-bottom:6px}
  a.game span{font-size:14px;font-style:italic;opacity:.75}
</style>
</head>
<body>
<div class="wrap">
  <h1>Two Small Games</h1>
  <a class="game" href="flowline/"><b>Flowline&trade;</b><span>Setup takes about 2 minutes. It is lying.</span></a>
  <a class="game" href="the-study/"><b>The Study</b><span>An escape room. The storm will keep you company.</span></a>
</div>
</body>
</html>
